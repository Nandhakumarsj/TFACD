seed: 42

data:
  # Change this to the selected DNN CSV on your workstation.
  raw_csv: "./datasets/Edge_IIoTset/Selected dataset for ML and DL/DNN-EdgeIIoT-dataset.csv"
  output_dir: "artifacts/data"
  label_column: "auto"
  attack_type_column: "auto"
  timestamp_column: "auto"
  group_column: "auto"
  drop_columns: []
  identifier_patterns:
    - "^src_ip$"
    - "^dst_ip$"
    - "^source_ip$"
    - "^destination_ip$"
    - "^frame\\.time"
    - "^ip\\.src_host$"
    - "^ip\\.dst_host$"
    - "^arp\\.src\\.proto_ipv4$"
    - "^arp\\.dst\\.proto_ipv4$"
  test_size: 0.15
  validation_size: 0.15
  max_rows: null
  sequence_length: 1
  sequence_stride: 1
  preserve_input_order: false

model:
  conv_channels: [64, 128]
  kernel_size: 3
  pooled_features: 16
  lstm_hidden: 128
  lstm_layers: 1
  bidirectional: true
  dropout: 0.25

training:
  epochs: 10
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  patience: 3
  class_weighting: true
  mixed_precision: false
  num_workers: 0

federated:
  num_clients: 5
  partition_mode: "dirichlet"
  dirichlet_alpha: 0.5
  min_samples_per_client: 100
  # min_samples_per_client only checks each client's TOTAL sample count - a rare
  # class (e.g. MITM, Fingerprinting) can be reduced to exactly 0 examples on a
  # client and still pass, since the total stays well above 100 from other
  # classes alone (verified empirically at lower alpha). This is a second,
  # opt-in guard: every client sees at least this many examples of EVERY class.
  # 1, not higher - Dirichlet partitioning exists specifically to simulate label
  # skew, so this only closes "a class is completely invisible to a client",
  # not "every client sees every class well" (which would defeat the point).
  min_class_samples_per_client: 1
  rounds: 3
  local_epochs: 1

integrity:
  max_abs_parameter: 1000000.0
  max_update_norm_ratio: 10.0
  pca_components: 5
  cluster_method: "agglomerative"
  min_benign_fraction: 0.5
  ema_alpha: 0.3
  reject_below_trust: 0.35
  # With num_clients=5, trim_ratio must be >= 0.2 to trim even one client
  # (floor(5 * ratio) == 0 below that, silently disabling trimmed_mean).
  trim_ratio: 0.2
  # Gate 4 found the detector alone only catches malicious clients ~33% of the
  # time (TPR); coordinate_median/trimmed_mean stayed robust under every attack
  # tested. Aggregating survivors with a robust method, not plain weighted_mean,
  # is defense-in-depth for whatever the detector misses.
  aggregation_method: "trimmed_mean"
  # Gate 4 attack-simulation parameters (scripts/run_integrity_benchmark.py only).
  attack_gaussian_sigma: 0.5
  attack_gradual_scaling_growth: 1.0

runtime:
  threat_context_mapping: "configs/threat_context.yaml"
  trust_policy_path: "configs/trust_policy.yaml"

agentic:
  decision_engine:
    # "template" (default) | "llm" - the LLM engine is opt-in and gated: see
    # agentic/factory.py::build_decision_engine, which refuses to construct it
    # without a passing artifacts/agentic/llm_benchmark_report.json.
    engine: "template"
    fallback_engine: "template"
  llm:
    provider: "ollama"
    model: "qwen3:8b"
    base_url: "http://localhost:11434"
    temperature: 0.0
    # 4096, not 8192: measured on this workstation's 8GB P4000, a real decision
    # uses ~534 prompt + ~703 output tokens, and halving num_ctx cut the model's
    # VRAM footprint 6041mb -> 5438mb, which is the difference between failing
    # and passing the benchmark gate's VRAM headroom check.
    num_ctx: 4096
    # LangGraph reason/validate retries before falling back to the deterministic
    # engine - see agentic/graph.py.
    max_attempts: 2
    # "function_calling" (default) requires Ollama tool-calling support -
    # verified live: gemma3:4b returns HTTP 400 "does not support tools" under
    # it. "json_mode" works with any model (schema spelled out in the prompt
    # instead of via tool metadata) - see agentic/graph.py::build_system_prompt.
    structured_output_method: "function_calling"
    request_timeout_seconds: 60
    require_benchmark_gate: true
    benchmark_report_path: "artifacts/agentic/llm_benchmark_report.json"

trust_boundary:
  weight_semantic_risk: 0.4       # ws
  weight_context_consistency: 0.3 # wc
  weight_behavioral_trust: 0.3    # wb
  trust_level_thresholds: {low: 0.40, medium: 0.65, high: 0.85}
  max_actions_per_plan: 5
  max_parameter_string_length: 512
  max_numeric_parameter: 1000000.0
  session_max_age_seconds: 300
  entity_action_quota_per_hour: 20
  sbert_model_name: "all-MiniLM-L6-v2"
  # Smooths behavioral trust across repeated interactions, same idiom as
  # PCAClusterEMAFilter.ema_alpha in the FTIL layer.
  ema_alpha: 0.3

streaming:
  model_path: "artifacts/models/flower_ftil_final.pt"
  public_key_path: "artifacts/keys/certification_ed25519_public.pem"
  # The one control that actually detects a retraining run silently replacing
  # the certified model (see integrity/certification.py::verify_release) -
  # defaulting to false would make Gate 6's "verification before runtime
  # loading" a slogan rather than a gate.
  require_signature: true
  require_certified_status: true
  # transform() cost is a measured, ~fixed 0.65s per call regardless of batch
  # size (the fitted preprocessor's vocabulary-sized OneHotEncoder dominates) -
  # batch_size is the only throughput knob that exists.
  batch_size: 1024
  max_records: 20000
  replay_seed: 42
  # Replay the exact held-out rows Gate 2/3 already scored offline, not
  # arbitrary (possibly training-set) rows - a deviation from the offline
  # macro-F1 then indicates a pipeline bug, not generalization.
  holdout_only: true
  emit_normal: false
  min_confidence: 0.0
  # Bounds how many alerts flow through the full agentic + trust-boundary path
  # (IDS inference itself still covers the whole batched replay) - the
  # per-agent entity_action_quota_per_hour above is a real security control,
  # not something to raise just to make a longer demo run pass.
  max_incidents: 10
